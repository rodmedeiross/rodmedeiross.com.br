{{ define "main" }}
  <div class="hx-mt-6 hx-mb-12">
    {{ with .Content }}
      <div class="hx-mb-10 hx-prose dark:hx-prose-invert">{{ . }}</div>
    {{ end }}

    <div class="hx-flex hx-flex-col hx-gap-6">
      {{ range (where .Site.RegularPages "Section" "blog") }}
        <article class="hx-border hx-border-gray-200 dark:hx-border-gray-700 hx-rounded-xl hx-p-6 hover:hx-border-gray-400 dark:hover:hx-border-gray-500 hx-transition-colors">
          <a href="{{ .Permalink }}" class="hx-no-underline">
            <h2 class="hx-text-xl hx-font-semibold hx-text-gray-900 dark:hx-text-gray-100 hx-mb-1">
              {{ .Title }}
            </h2>
          </a>

          <div class="hx-flex hx-items-center hx-gap-3 hx-text-sm hx-text-gray-500 dark:hx-text-gray-400 hx-mb-3">
            <time datetime="{{ .Date.Format "2006-01-02" }}">
              {{ .Date.Format "January 2, 2006" }}
            </time>
            {{ with .Params.tags }}
              <span>·</span>
              <div class="hx-flex hx-gap-2">
                {{ range . }}
                  <span class="hx-bg-gray-100 dark:hx-bg-gray-800 hx-px-2 hx-py-0.5 hx-rounded">
                    {{ . }}
                  </span>
                {{ end }}
              </div>
            {{ end }}
          </div>

          {{ with .Summary }}
            <p class="hx-text-gray-600 dark:hx-text-gray-400 hx-text-sm hx-leading-relaxed">
              {{ . }}
            </p>
          {{ end }}
        </article>
      {{ end }}
    </div>
  </div>
{{ end }}
