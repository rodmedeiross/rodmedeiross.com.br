# Hugo configuration file
baseURL: https://rodmedeiross.com.br/
title: rodmedeiross.com.br
defaultContentLanguage: en

# Enable Git info for last modified dates
enableGitInfo: true

# Import Hextra theme as Hugo Module
module:
  imports:
    - path: github.com/imfing/hextra

# Languages
languages:
  en:
    languageName: English
    languageCode: en-us
    weight: 1
    title: rodmedeiross.com.br
    params:
      description: Public notebook — ideas, learnings, and things I build.
    menu:
      main:
        - name: Blog
          pageRef: /blog
          weight: 1
        - name: About
          pageRef: /about
          weight: 2
        - name: Search
          weight: 3
          params:
            type: search
        - name: Theme
          weight: 4
          params:
            type: theme-toggle
        - name: GitHub
          weight: 5
          url: "https://github.com/rodmedeiross"
          params:
            icon: github
  pt:
    languageName: Português
    languageCode: pt-br
    weight: 2
    title: rodmedeiross.com.br
    params:
      description: Caderno público — ideias, aprendizados e coisas que eu construo.
    menu:
      main:
        - name: Blog
          pageRef: /blog
          weight: 1
        - name: Sobre
          pageRef: /about
          weight: 2
        - name: Buscar
          weight: 3
          params:
            type: search
        - name: Tema
          weight: 4
          params:
            type: theme-toggle
        - name: GitHub
          weight: 5
          url: "https://github.com/rodmedeiross"
          params:
            icon: github

# Markdown rendering
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

# Enable useful outputs
outputs:
  home: [html, rss]
  page: [html]
  section: [html, rss]

enableRobotsTXT: true

# Theme parameters (shared across languages)
params:
  navbar:
    displayTitle: true
    displayLogo: false

  page:
    width: normal

  theme:
    default: system
    displayToggle: true

  footer:
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/rodmedeiross/rodmedeiross.com.br/edit/main"

  blog:
    list:
      displayTags: true
    article:
      displayPagination: true

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
