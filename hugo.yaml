# Hugo configuration file
baseURL: https://rodmedeiross.com.br/
title: rodmedeiross
languageCode: en-us
defaultContentLanguage: en

# Enable Git info for last modified dates
enableGitInfo: true

# Import Hextra theme as Hugo Module
module:
  imports:
    - path: github.com/imfing/hextra

# Markdown rendering
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

# Enable useful outputs
outputs:
  home: [html, rss]
  page: [html]
  section: [html, rss]

enableRobotsTXT: true

# Menu - Navigation bar
menu:
  main:
    - name: Blog
      pageRef: /blog
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
    - name: GitHub
      weight: 4
      url: "https://github.com/rodmedeiross"
      params:
        icon: github

  sidebar:
    - name: More
      params:
        type: separator
      weight: 1
    - name: "About"
      pageRef: "/about"
      weight: 2

# Theme parameters
params:
  description: Public notebook — ideas, learnings, and things I build.

  navbar:
    displayTitle: true
    displayLogo: false

  page:
    width: normal

  theme:
    default: system
    displayToggle: true

  footer:
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/rodmedeiross/rodmedeiross.com.br/edit/main"

  blog:
    list:
      displayTags: true
    article:
      displayPagination: true

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

